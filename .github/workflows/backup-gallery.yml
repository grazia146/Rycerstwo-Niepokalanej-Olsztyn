name: Backup galerii Supabase

on:
  schedule:
    - cron: "0 16 * * 0"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backup-gallery.yml"
      - ".github/scripts/backup-gallery.mjs"

permissions:
  contents: write

concurrency:
  group: gallery-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pobierz zdjęcia i metadane galerii
        run: node .github/scripts/backup-gallery.mjs

      - name: Zapisz kopię w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backup/gallery/current
          if git diff --cached --quiet; then
            echo "Brak zmian w galerii — kopia jest aktualna."
          else
            git commit -m "Automatyczna kopia galerii"
            git push
          fi
